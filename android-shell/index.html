<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#12141a" />
    <title>vibe study</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        padding: 24px;
        background: #12141a;
        color: #e8eaf0;
        font-family: -apple-system, 'PingFang SC', 'Noto Sans CJK SC', sans-serif;
      }
      .logo { font-size: 22px; font-weight: 600; }
      .card {
        width: 100%;
        max-width: 420px;
        padding: 20px;
        border: 1px solid #2e3342;
        border-radius: 14px;
        background: #1a1d26;
      }
      .server {
        word-break: break-all;
        color: #6c8cff;
        font-size: 15px;
        margin: 8px 0 16px;
      }
      button {
        width: 100%;
        min-height: 46px;
        border: none;
        border-radius: 12px;
        background: #6c8cff;
        color: #0b1020;
        font-size: 16px;
        font-weight: 600;
      }
      button.ghost {
        margin-top: 10px;
        background: transparent;
        border: 1px solid #2e3342;
        color: #99a0b0;
        font-weight: 400;
      }
      input {
        width: 100%;
        padding: 12px;
        margin: 8px 0 12px;
        border: 1px solid #2e3342;
        border-radius: 12px;
        background: #232734;
        color: #e8eaf0;
        font-size: 15px;
      }
      .hint { color: #99a0b0; font-size: 13px; line-height: 1.6; margin: 6px 0 0; }
      .error { color: #e0685c; font-size: 13px; margin: 6px 0 0; display: none; }
      #editArea { display: none; }
    </style>
  </head>
  <body>
    <div class="logo">vibe study</div>

    <div class="card" id="enterArea">
      <div>服务器</div>
      <div class="server" id="serverText"></div>
      <button id="enterBtn">进入</button>
      <button class="ghost" id="editBtn">修改服务器地址</button>
      <p class="hint" id="autoHint">倒计时 <span id="countdown">2</span> 秒后自动进入，点「修改服务器地址」取消。</p>
      <p class="hint" id="otaHint" role="status" style="display: none"></p>
    </div>

    <div class="card" id="editArea">
      <div>服务器地址</div>
      <input id="serverInput" type="url" inputmode="url" placeholder="https://study.sii.edu.cn 或 192.168.1.5:8787" />
      <button id="saveBtn">保存并进入</button>
      <button class="ghost" id="cancelBtn">返回</button>
      <p class="error" id="errorText">地址无法识别，示例：https://study.sii.edu.cn 或 10.0.0.1:8787</p>
      <p class="hint">地址只保存在这台手机本地；改服务器不用重新安装应用。</p>
    </div>

    <script src="boot.js"></script>
    <script>
      function byId(id) { return document.getElementById(id) }
      var autoTimer = null

      /** 用户手动点「进入」：与倒计时自然走完同一口径——先检查更新再决定是否放行。 */
      function enterWithUpdateCheck(server) {
        cancelAuto()
        window.VibeBoot.checkAppUpdate(server).then(function (state) {
          if (state.status === 'downloading' || state.status === 'need-permission') {
            byId('otaHint').textContent = state.versionName
              ? '发现新版本 ' + state.versionName + '，' + (state.status === 'need-permission' ? '请在系统设置里允许本应用安装未知来源包后重开应用。' : '更新包下载中，完成后请在弹出的安装界面点「安装」。')
              : '更新包下载中，完成后请在弹出的安装界面点「安装」。'
            byId('otaHint').style.display = 'block'
            return
          }
          window.VibeBoot.enterApp(server)
        })
      }

      function showEnter(server) {
        byId('serverText').textContent = server
        byId('enterArea').style.display = 'block'
        byId('editArea').style.display = 'none'
        byId('otaHint').style.display = 'none'

        var left = 2
        byId('countdown').textContent = String(left)
        autoTimer = setInterval(function () {
          left -= 1
          if (left <= 0) {
            clearInterval(autoTimer)
            autoTimer = null
            enterWithUpdateCheck(server)
            return
          }
          byId('countdown').textContent = String(left)
        }, 1000)
      }

      function stopAuto() {
        if (autoTimer !== null) {
          clearInterval(autoTimer)
          autoTimer = null
        }
      }

      /** 取消自动进入并收走倒计时提示：用户已主动选择留在此页。 */
      function cancelAuto() {
        stopAuto()
        byId('autoHint').style.display = 'none'
      }

      /* Android 返回键：仅在系统壳内接线。编辑区返回 → 回进入区；
         进入区倒计时中返回 → 取消自动进入只剩手动进入；否则退出应用。 */
      if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.App) {
        window.Capacitor.Plugins.App.addListener('backButton', function () {
          var action = window.VibeBoot.resolveBootBack({
            editing: byId('editArea').style.display === 'block',
            autoCounting: autoTimer !== null,
          })
          if (action === 'cancel-edit') {
            window.addEventListener('focus', function () {
        // 从「安装未知应用」系统设置回到启动页：权限一开即自动复查，
        // 本次检查到新版会直接拉起下载，不再等重启
        if (byId('otaHint').style.display === 'block' && autoTimer === null) {
          enterWithUpdateCheck(window.VibeBoot.loadSavedServer())
        }
      })

      showEnter(window.VibeBoot.loadSavedServer())
            return
          }
          if (action === 'cancel-countdown') {
            cancelAuto()
            return
          }
          window.Capacitor.Plugins.App.exitApp()
        })
      }

      byId('enterBtn').addEventListener('click', function () {
        enterWithUpdateCheck(window.VibeBoot.loadSavedServer())
      })

      byId('editBtn').addEventListener('click', function () {
        stopAuto()
        byId('serverInput').value = window.VibeBoot.loadSavedServer()
        byId('errorText').style.display = 'none'
        byId('enterArea').style.display = 'none'
        byId('editArea').style.display = 'block'
      })

      byId('cancelBtn').addEventListener('click', function () {
        showEnter(window.VibeBoot.loadSavedServer())
      })

      byId('saveBtn').addEventListener('click', function () {
        var server = window.VibeBoot.normalizeServerUrl(byId('serverInput').value)
        if (!server) {
          byId('errorText').style.display = 'block'
          return
        }
        window.VibeBoot.saveServer(server)
        enterWithUpdateCheck(server)
      })

      showEnter(window.VibeBoot.loadSavedServer())
    </script>
  </body>
</html>
