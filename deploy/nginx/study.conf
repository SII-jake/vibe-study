# study.sii.edu.cn：vibe study
# 安装位置：/etc/nginx/conf.d/study.conf
#
# 页面与接口都由 127.0.0.1:8787 的进程提供：静态产物由该进程按自身目录读取，
# 因此这里不出现任何文件系统路径，换部署位置只动进程，不动本文件。

# 把客户端是否要求升级连接转成 upstream 用的 Connection 头。
# 定义在 http 层（conf.d/*.conf 即在 http 内），server 块里只引用。
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 443 ssl;
    server_name study.sii.edu.cn;

    ssl_certificate     /etc/nginx/certs/sii.edu.cn.crt;
    ssl_certificate_key /etc/nginx/certs/_.sii.edu.cn.key;

    access_log /var/log/nginx/study.access.log main;
    error_log  /var/log/nginx/study.error.log warn;

    location / {
        proxy_pass http://127.0.0.1:8787;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 开发期 vite dev server 的 HMR 走 WebSocket；不透传 Upgrade 头
        # 浏览器只会拿到 200 而非 101，热更新静默失效。
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        # 流式回答：不缓冲、不掐断空闲，否则前端拿不到增量。
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
